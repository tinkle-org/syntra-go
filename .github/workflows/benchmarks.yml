name: Benchmarks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmarks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CGO_ENABLED: '0'
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.10'
          cache: true
      - name: Wire, session and encrypted-record samples (report only)
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/syntra-benchmarks"
          {
            git rev-parse HEAD
            go version
            go test -mod=readonly -run '^$' -bench . -benchmem -count=3 -benchtime=100ms -cpu=1,4 -timeout=10m ./...
          } | tee "$RUNNER_TEMP/syntra-benchmarks/benchmarks.txt"
          python3 - "$RUNNER_TEMP/syntra-benchmarks/benchmarks.txt" <<'PY'
          import pathlib, re, sys
          output = pathlib.Path(sys.argv[1]).read_text()
          if re.search(r"--- FAIL:|^FAIL\b|^panic:", output, re.MULTILINE):
              sys.exit("benchmark output contains a failed sample")
          PY
      - name: Upload benchmark samples
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmarks
          path: ${{ runner.temp }}/syntra-benchmarks/benchmarks.txt
          if-no-files-found: ignore
          retention-days: 14
