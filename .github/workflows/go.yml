name: Go

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pure-go:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CGO_ENABLED: '0'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.26.10'
          cache: true
      - name: Formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            printf '%s\n' "$unformatted"
            exit 1
          fi
      - name: Build (CGO disabled)
        env:
          CGO_ENABLED: '0'
        run: go build -mod=readonly ./...
      - name: SDK unit and loopback integration tests (CGO disabled)
        env:
          CGO_ENABLED: '0'
        run: go test -mod=readonly -count=1 ./...
      - name: Vet
        run: go vet -mod=readonly ./...
      - name: Race detector
        env:
          CGO_ENABLED: '1'
        run: go test -mod=readonly -race -count=1 ./...

  network-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CGO_ENABLED: '1'
      GOTOOLCHAIN: local
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.26.10'
          cache: true
      - name: Race-tested managed networking and real loopback carriers
        shell: bash
        run: |
          set -euo pipefail
          go list -mod=readonly -f '{{.ImportPath}}' ./network ./routes ./proxy ./transport/... > "$RUNNER_TEMP/network-packages.txt"
          go test -mod=readonly -race -count=1 -json -timeout=10m ./network ./routes ./proxy ./transport/... | tee "$RUNNER_TEMP/network-tests.jsonl"
      - name: Require package and relevant test execution
        run: |
          python3 - <<'PY'
          import json, os, pathlib

          temp = pathlib.Path(os.environ["RUNNER_TEMP"])
          packages = set((temp / "network-packages.txt").read_text().splitlines())
          module = "github.com/tinkle-org/syntra-go"
          required = {
              "network": [
                  "TestManagedTCPPushCallsAndGenerationFences",
                  "TestManagedWSAndWSSListeners",
                  "TestManagedHTTPAndHTTPSIdlePushLossPauseResume",
                  "TestNotificationWaitCannotMoveIntoSuccessorGeneration",
                  "TestRecoveryPreparedBeforeRunAndFreshNegotiationEachGeneration",
                  "TestManagedHTTPMutationNeverReplayed",
                  "TestManagedHTTPIncompleteShutdownRetainsCallbackAndNativeOwner",
                  "TestManagedHealthyCloseAccounting",
                  "TestManagedPendingCloseCountsOnlyJoinedOverdueRetirement",
                  "TestManagedJoinedCleanupFailureReportedOnceWithoutReplacement",
                  "TestManagedCallerTimeoutDoesNotFailCleanCompletion",
                  "TestAcceptRetryBoundaryAndControls",
                  "TestAcceptSocketSetupRetriesBeforeAuthentication",
                  "TestAcceptLiveRPCProgressesDuringRetry",
                  "TestAcceptErrorTerminalCountedOnce",
              ],
              "routes": ["TestTCPRouteReachesProtectedReadinessAndPush", "TestHTTPRouteIntegrations"],
              "proxy": ["TestHTTPConnectRemoteNameAndNoOverread", "TestSOCKSRawCredentialsRemoteDNSAndRules"],
              "transport/tcp": ["TestLoopbackSessionsPushWithoutCall"],
              "transport/websocket": ["TestLoopbackSessionsAndTLSProvidersPushWithoutCall"],
              "transport/http": [
                  "TestHTTPAndHTTPSFullConnections", "TestHTTPSLongPollPushWithoutRPC",
                  "TestSourceRateRejectionPreservesOtherSourcesGlobalTokens",
                  "TestFullSourceRegistryPreservesStatusAndGlobalTokens",
                  "TestGlobalRateRejectionStillChargesAdmittedSource",
                  "TestFullSourceRegistryReturnsNative503BeforeBody",
              ],
              "transport/tlsstream": ["TestStandardTLSAuthenticationFailuresAreTerminal"],
              "transport/stream": ["TestGateChecksSynchronousCompletion"],
              "transport/ordered": [
                  "TestPublicDriverBothModesAndMaximumFrame",
                  "TestBufferedRecordDecryptAfterLocalStopIsClosed",
                  "TestLocalStopKeepsDetectedDecryptFailureTerminal",
                  "TestClosedCipherWithoutLocalStopIsProtocolFailure",
                  "TestTerminalSecurityFailureUpgradesLossAndStaysFirst",
              ],
          }
          if not packages or not {f"{module}/{p}" for p in required} <= packages:
              raise SystemExit("network package selection is empty or incomplete")
          events = [json.loads(line) for line in (temp / "network-tests.jsonl").read_text().splitlines()]
          if any(e.get("Action") == "fail" for e in events):
              raise SystemExit("network test failure")
          ran = {(e.get("Package"), e.get("Test")) for e in events if e.get("Action") == "run" and e.get("Test")}
          passed = {(e.get("Package"), e.get("Test")) for e in events if e.get("Action") == "pass" and e.get("Test")}
          package_passes = {e.get("Package") for e in events if e.get("Action") == "pass" and not e.get("Test")}
          for package in packages:
              executed = {test for pkg, test in ran & passed if pkg == package}
              if package not in package_passes or not executed:
                  raise SystemExit(f"no successful test execution: {package}")
              print(f"{package}: {len(executed)} tests/subtests executed and passed")
          for suffix, tests in required.items():
              package = f"{module}/{suffix}"
              for test in tests:
                  if (package, test) not in ran & passed:
                      raise SystemExit(f"required test did not execute and pass: {package} {test}")
                  children = [e for e in events if e.get("Package") == package and e.get("Test", "").startswith(test + "/")]
                  if any(e.get("Action") == "skip" for e in children):
                      raise SystemExit(f"required coverage skipped: {package} {test}")
          # Current WS/WSS subtest names encode their carrier bytes as escaped characters.
          for carrier in (r"\x02", r"\x03"):
              key = (f"{module}/network", f"TestManagedWSAndWSSListeners/{carrier}")
              if key not in ran & passed:
                  raise SystemExit(f"WebSocket loopback coverage missing: {key}")
          # Both candidate carriers and every direct/proxy route must run, not just their parent tests.
          for carrier in ("HTTP", "HTTPS"):
              key = (f"{module}/network", f"TestManagedHTTPAndHTTPSIdlePushLossPauseResume/{carrier}")
              if key not in ran & passed:
                  raise SystemExit(f"candidate loopback coverage missing: {key}")
          for mode in ("bootstrap", "returning"):
              for route in ("http", "https", "http-connect", "http-socks", "https-connect", "https-socks", "http-forward"):
                  key = (f"{module}/routes", f"TestHTTPRouteIntegrations/{mode}/{route}")
                  if key not in ran & passed:
                      raise SystemExit(f"route loopback coverage missing: {key}")
          PY

  dependency-isolation:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CGO_ENABLED: '0'
      GOTOOLCHAIN: local
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.26.10'
          cache: true
      - name: Root and securechannel production dependency isolation
        run: |
          python3 - <<'PY'
          import subprocess

          module = "github.com/tinkle-org/syntra-go"
          forbidden = ["net", "crypto/tls"] + [f"{module}/{p}" for p in ("network", "routes", "proxy", "connection", "transport")]
          for package in (".", "./securechannel"):
              output = subprocess.check_output(["go", "list", "-mod=readonly", "-deps", "-f", "{{.ImportPath}}", package], text=True)
              deps = set(output.splitlines())
              if not deps:
                  raise SystemExit(f"empty dependency graph: {package}")
              unexpected = sorted(dep for dep in deps if any(dep == prefix or dep.startswith(prefix + "/") for prefix in forbidden))
              if unexpected:
                  raise SystemExit(f"networking dependencies in {package}: {unexpected}")
              print(f"{package}: production dependency isolation passed")
          PY
      - name: Default HTTP candidate rejection and explicit per-config opt-in
        shell: bash
        run: |
          set -euo pipefail
          go test -mod=readonly -count=1 -json -run '^TestHTTPCandidatePolicyIsScoped$' ./securechannel | tee "$RUNNER_TEMP/candidate-tests.jsonl"
          python3 - <<'PY'
          import json, os, pathlib

          events = [json.loads(line) for line in (pathlib.Path(os.environ["RUNNER_TEMP"]) / "candidate-tests.jsonl").read_text().splitlines()]
          package = "github.com/tinkle-org/syntra-go/securechannel"
          test = "TestHTTPCandidatePolicyIsScoped"
          required = {test} | {f"{test}/{carrier}/{mode}" for carrier in ("http", "https") for mode in ("bootstrap", "returning")}
          for action in ("run", "pass"):
              seen = {e.get("Test") for e in events if e.get("Package") == package and e.get("Action") == action}
              if not required <= seen:
                  raise SystemExit(f"candidate policy {action} coverage missing: {sorted(required - seen)}")
          if any(e.get("Action") in ("fail", "skip") for e in events):
              raise SystemExit("candidate policy failed or skipped")
          if not any(e.get("Package") == package and e.get("Action") == "pass" and not e.get("Test") for e in events):
              raise SystemExit("candidate policy package did not pass")
          print("default candidate rejection and scoped opt-in executed for both carriers and modes")
          PY

  generated-go:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99 # v1.50.0
        with:
          version: '1.59.0'
          github_token: ${{ github.token }}
      - name: Protobuf formatting
        run: buf format --diff --exit-code
      - name: Protobuf lint
        run: buf lint --error-format=github-actions
      - name: Protobuf build
        run: buf build --error-format=github-actions
      - name: Canonical Go package options
        run: python3 scripts/check-go-package.py
      - name: Schema and generation script tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Pinned Go generation drift check
        run: python3 scripts/check-generated.py
      - name: Protobuf compatibility against PR base
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            printf '%s\n' 'Invalid PR base commit SHA' >&2
            exit 1
          fi
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          test "$(git rev-parse --verify FETCH_HEAD)" = "$BASE_SHA"
          buf breaking --against ".git#ref=$BASE_SHA" --error-format=github-actions

  compat:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CGO_ENABLED: '0'
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        go-version: ['1.23.12', '1.26.10']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ matrix.go-version }}
          cache: true
      - name: Verify go.mod consistency
        run: |
          go mod verify
          git diff --exit-code -- go.mod go.sum
        env:
          GOTOOLCHAIN: local
      - name: Build (min and current toolchain)
        run: go build -mod=readonly ./...
        env:
          GOTOOLCHAIN: local
      - name: Vet (min and current toolchain)
        run: go vet -mod=readonly ./...
        env:
          GOTOOLCHAIN: local
      - name: Test (min and current toolchain)
        run: go test -mod=readonly -count=1 ./...
        env:
          GOTOOLCHAIN: local
      - name: Race detector (compiler instrumentation requires CGO)
        run: go test -mod=readonly -race -count=1 ./...
        env:
          CGO_ENABLED: '1'
          GOTOOLCHAIN: local
      - name: Compile-only cross targets (current toolchain only)
        if: matrix.go-version == '1.26.10'
        run: |
          GOOS=linux GOARCH=amd64 go build -mod=readonly ./...
          GOOS=linux GOARCH=arm64 go build -mod=readonly ./...
          GOOS=darwin GOARCH=amd64 go build -mod=readonly ./...
          GOOS=darwin GOARCH=arm64 go build -mod=readonly ./...
          GOOS=windows GOARCH=amd64 go build -mod=readonly ./...

  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CGO_ENABLED: '0'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.26.10'
          cache: true
      - name: govulncheck (reachable vulnerabilities only)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          govulncheck ./...
      - name: staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@2025.1.1
          staticcheck ./...

  fuzz-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CGO_ENABLED: '0'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.26.10'
          cache: true
      - name: Seed regression tests
        run: go test -mod=readonly -run 'TestFuzzSeedCorpus|TestReliableFreshReattach|TestReliableForgetUsesCaller' -count=1 -v ./...
      - name: Bounded fuzz smoke (30s each)
        run: |
          go test -mod=readonly -fuzz=FuzzUnmarshalFrame -fuzztime=30s .
          go test -mod=readonly -fuzz=FuzzDuplicateContent -fuzztime=30s .
          go test -mod=readonly -run '^$' -fuzz=FuzzHTTPHeaders -fuzztime=30s ./transport/http
          go test -mod=readonly -run '^$' -fuzz=FuzzRecordFrames -fuzztime=30s ./transport/websocket

  actionlint:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.26.10'
          cache: true
      - name: Install pinned actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Lint workflows
        run: actionlint .github/workflows/*.yml

  ci-success:
    needs: [pure-go, network-integration, dependency-isolation, generated-go, compat, security, fuzz-smoke, actionlint]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Aggregate required checks
        run: |
          python3 - <<'PY'
          import json, os, sys
          needs = json.loads(os.environ["NEEDS_JSON"])
          failed = []
          for name, res in needs.items():
              r = res.get("result")
              if r != "success":
                  failed.append(f"{name}={r}")
          if failed:
              print("required checks failed: " + ", ".join(failed))
              sys.exit(1)
          print("all required checks passed")
          PY
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
