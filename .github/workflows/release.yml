name: Release

# Go modules ship via immutable git tags (vX.Y.Z) and the Go module proxy.
# No binary publishing, no PR-triggered releases. Tag pushes only; PRs cannot
# trigger this workflow. Protection comes from the `release` environment
# (required reviewers) plus a ruleset requiring `ci-success`.
on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    environment: release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.26.4'
          cache: true
      - name: Verify tag matches root module versioning
        run: |
          tag="${GITHUB_REF_NAME}"
          case "$tag" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "tag $tag is not vX.Y.Z" >&2; exit 1 ;;
          esac
          test -f go.mod
          grep -q '^module github.com/tinkle-org/syntra-go$' go.mod
          git tag --list | grep -qx "$tag"
      - name: Verify tag ancestry and immutable source revision
        run: |
          git fetch --tags --force
          git verify-commit HEAD 2>/dev/null || echo "no gpg signature; ancestry check only"
          git merge-base --is-ancestor HEAD "${GITHUB_REF}" || (echo "tag does not contain HEAD" >&2; exit 1)
          git log -1 --format='%H %s'
      - name: Verify dependencies and schema provenance
        run: |
          go mod verify
          git diff --exit-code -- go.mod go.sum
          go list -m all
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.14'
      - uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99 # v1.50.0
        with:
          version: '1.59.0'
          github_token: ${{ github.token }}
      - name: Generated-code drift (release gate)
        run: python3 scripts/check-generated.py
      - name: Pure-Go validation (release gate)
        run: |
          CGO_ENABLED=0 go build -mod=readonly ./...
          CGO_ENABLED=0 go test -mod=readonly -count=1 ./...
          go vet -mod=readonly ./...
          CGO_ENABLED=1 go test -mod=readonly -race -count=1 ./...
      - name: Checksums for distributed source
        run: |
          git archive --format=tar.gz --prefix="${GITHUB_REF_NAME}/" HEAD > "../${GITHUB_REF_NAME}.tar.gz"
          shasum -a 256 "../${GITHUB_REF_NAME}.tar.gz" | tee "../${GITHUB_REF_NAME}.sha256"
