name: Scheduled

# Thorough weekly checks. PR CI stays fast; main pushes run Go CI;
# this workflow runs longer fuzz, full govulncheck detail, and CodeQL-adjacent
# hygiene without blocking merges.
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  extended-fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CGO_ENABLED: '0'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.10'
          cache: true
      - name: Extended fuzz (5m each, bounded inputs)
        run: |
          go test -mod=readonly -fuzz=FuzzUnmarshalFrame -fuzztime=5m .
          go test -mod=readonly -fuzz=FuzzDuplicateContent -fuzztime=5m .

  extended-security:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.10'
          cache: true
      - name: govulncheck verbose
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          govulncheck -show verbose ./...
      - name: staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@2025.1.1
          staticcheck ./...
