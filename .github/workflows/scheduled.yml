name: Scheduled

# Thorough weekly checks. PR CI stays fast; main pushes run Go CI;
# this workflow runs longer fuzz, full govulncheck detail, and CodeQL-adjacent
# hygiene without blocking merges.
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  extended-fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.26.4'
          cache: true
      - name: Extended fuzz (5m each, bounded inputs)
        run: |
          go test -mod=readonly -fuzz=FuzzUnmarshalFrame -fuzztime=5m .
          go test -mod=readonly -fuzz=FuzzDuplicateContent -fuzztime=5m .

  extended-security:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.26.4'
          cache: true
      - name: govulncheck verbose
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          govulncheck -show verbose ./...
      - name: staticcheck (all tags)
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@2025.1.1
          staticcheck ./...
          staticcheck -tags syntranative ./...
