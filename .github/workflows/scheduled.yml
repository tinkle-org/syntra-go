name: Scheduled

# Thorough weekly checks. PR CI stays fast; main pushes run Go CI;
# this workflow runs longer fuzz, full govulncheck detail, and CodeQL-adjacent
# hygiene without blocking merges.
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  extended-fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.26.10'
          cache: true
      - name: Extended fuzz (5m each, bounded inputs)
        run: |
          go test -mod=readonly -fuzz=FuzzUnmarshalFrame -fuzztime=5m .
          go test -mod=readonly -fuzz=FuzzDuplicateContent -fuzztime=5m .

  extended-security:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      RUSTUP_TOOLCHAIN: '1.88.0'
      CGO_ENABLED: '1'
      CARGO_TARGET_DIR: ${{ github.workspace }}/.tmp/syntra-rs/target
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Checkout matching Rust extraction
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: tinkle-org/syntra-rs
          ref: fca1063515d3966be71e9844346e7cbc53769c76
          path: .tmp/syntra-rs
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.26.10'
          cache: true
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: '1.88.0'
      - name: Build production FFI (not the test fixture)
        run: cargo build --locked --manifest-path .tmp/syntra-rs/Cargo.toml -p syntra-ffi --no-default-features --features production
      - name: govulncheck verbose
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          govulncheck -show verbose ./...
      - name: staticcheck (all tags)
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@2025.1.1
          staticcheck ./...
          LIBDIR="$CARGO_TARGET_DIR/debug"
          export CGO_LDFLAGS="-L$LIBDIR"
          export LD_LIBRARY_PATH="$LIBDIR${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          staticcheck -tags syntranative ./...
