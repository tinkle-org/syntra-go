syntax = "proto3";

package syntra.v1;

option go_package = "github.com/tinkle-org/syntra-go/gen/syntra/v1;syntrav1";

// ErrorCode defines typed failures independently of transport-specific status.
// Consumers report unknown numeric values as UNKNOWN, never success, retaining
// the original number diagnostically where possible. Generated enum getters
// alone do not implement that policy.
enum ErrorCode {
  // ERROR_CODE_UNSPECIFIED is not a valid failure outcome.
  ERROR_CODE_UNSPECIFIED = 0;
  // ERROR_CODE_CANCELLED indicates cancellation.
  ERROR_CODE_CANCELLED = 1;
  // ERROR_CODE_UNKNOWN indicates an unclassified failure.
  ERROR_CODE_UNKNOWN = 2;
  // ERROR_CODE_INVALID_ARGUMENT indicates invalid arguments or envelope shape.
  ERROR_CODE_INVALID_ARGUMENT = 3;
  // ERROR_CODE_DEADLINE_EXCEEDED indicates budget expiry, not rollback.
  ERROR_CODE_DEADLINE_EXCEEDED = 4;
  // ERROR_CODE_NOT_FOUND indicates a missing target.
  ERROR_CODE_NOT_FOUND = 5;
  // ERROR_CODE_ALREADY_EXISTS indicates a creation conflict.
  ERROR_CODE_ALREADY_EXISTS = 6;
  // ERROR_CODE_PERMISSION_DENIED indicates insufficient access.
  ERROR_CODE_PERMISSION_DENIED = 7;
  // ERROR_CODE_RESOURCE_EXHAUSTED indicates an exhausted resource budget.
  ERROR_CODE_RESOURCE_EXHAUSTED = 8;
  // ERROR_CODE_FAILED_PRECONDITION indicates an operation cannot currently run.
  ERROR_CODE_FAILED_PRECONDITION = 9;
  // ERROR_CODE_ABORTED indicates an aborted sequence.
  ERROR_CODE_ABORTED = 10;
  // ERROR_CODE_OUT_OF_RANGE indicates a value outside the supported range.
  ERROR_CODE_OUT_OF_RANGE = 11;
  // ERROR_CODE_UNIMPLEMENTED indicates an unknown method or unsupported feature.
  ERROR_CODE_UNIMPLEMENTED = 12;
  // ERROR_CODE_INTERNAL indicates an internal failure.
  ERROR_CODE_INTERNAL = 13;
  // ERROR_CODE_UNAVAILABLE indicates unavailability; effects may be unknown.
  ERROR_CODE_UNAVAILABLE = 14;
  // ERROR_CODE_DATA_LOSS indicates unrecoverable corruption or loss.
  ERROR_CODE_DATA_LOSS = 15;
  // ERROR_CODE_UNAUTHENTICATED indicates missing or unaccepted credentials.
  ERROR_CODE_UNAUTHENTICATED = 16;
}

// RpcError is a public typed failure.
message RpcError {
  // code is nonzero on emission; unknown received numbers are reported as UNKNOWN.
  ErrorCode code = 1;
  // message is public text, never credentials or private diagnostics. Clients
  // branch on code, not message text.
  string message = 2;
}
