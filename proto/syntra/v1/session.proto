// No separate session-control messages are defined in the core envelope.
// Establishment is implicit at ServerReady; lifetime is bound to the connection.
// Authentication uses ClientHello.credential; principal changes require a new
// handshake. The core envelope does not carry resumable-session handles.
syntax = "proto3";

package syntra.v1;

option go_package = "github.com/tinkle-org/syntra-go/gen/syntra/v1;syntrav1";
